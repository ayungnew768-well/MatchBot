name: Build MatchBot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          unzip -q MatchBot_OnlineBuild.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Repair Android resources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/MatchBot/app/src/main/res/xml/accessibility_service_config.xml")

          text = p.read_text(encoding="utf-8")

          lines = []
          for line in text.splitlines():
              if "android:description=" not in line:
                  lines.append(line)

          p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("=== accessibility_service_config.xml ===")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Build APK
        working-directory: project/MatchBot
        run: |
          gradle clean :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MatchBot-APK
          path: project/MatchBot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
